<html>

<head>
  <title>Register Router</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
  <h1>Register Router</h1>
  <form method="POST" action="/add">
    <input name="ip" placeholder="IP:" required />
    <input name="username" placeholder="Username:" required />
    <input name="password" placeholder="Password:" required />
    <button type="submit">Add Router</button>
  </form>

  <h2>Router List</h2>
  <ul>
    {% for router in data %}
    <li>
      <a href="/router/{{ router.ip }}">{{ router.ip }}</a> - {{ router.username }}
      <form method="POST" action="{{ url_for('delete_router', idx=router._id) }}" style="display:inline">
        <button type="submit">Delete</button>
      </form>
    </li>
    {% endfor %}
  </ul>

</body>

</html>
